<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23d4a017'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%23fff3c4' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-coin" aria-hidden="true"></span>
        <div>
          <h1>Coin Builder</h1>
          <p class="sub">Turn your artwork into a custom coin</p>
        </div>
      </div>
      <button id="restart" class="ghost" type="button" title="Start over">Start over</button>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-label="Conversation"></section>

    <div id="chips" class="chips" role="group" aria-label="Quick replies"></div>

    <form id="composer" class="composer" autocomplete="off">
      <label class="attach" title="Attach an image">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19 7v2.99s-1.99.01-2 0V7h-3s.01-1.99 0-2h3V2h2v3h3v2h-3zm-3 4V8h-3V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8h-3zM5 19l3-4 2 3 3-4 4 5H5z"/></svg>
        <span class="sr-only">Attach image</span>
      </label>
      <input id="text" type="text" placeholder="Type a message or attach your image…" aria-label="Message">
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </form>
    <div id="drop" class="drop" hidden>Drop your image to upload</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
